  <script>
    const svg = document.getElementById('svg');
    const info = document.getElementById('info');
    let isPanning = false;
    let startX = 0, startY = 0;
    let vb = [3200, 600, 2200, 3900];

    svg.addEventListener('mousedown', (e) => {
      isPanning = true;
      startX = e.clientX;
      startY = e.clientY;
      svg.style.cursor = 'grabbing';
    });

    window.addEventListener('mousemove', (e) => {
      if (isPanning) {
        const dx = (e.clientX - startX) * (vb[2] / svg.clientWidth);
        const dy = (e.clientY - startY) * (vb[3] / svg.clientHeight);
        vb[0] -= dx;
        vb[1] -= dy;
        svg.setAttribute('viewBox', vb.join(' '));
        startX = e.clientX;
        startY = e.clientY;
      }
      const rect = svg.getBoundingClientRect();
      const mx = vb[0] + (e.clientX - rect.left) * (vb[2] / rect.width);
      const my = 5200 - (vb[1] + (e.clientY - rect.top) * (vb[3] / rect.height));
      info.textContent = `X: ${Math.round(mx)}, Y: ${Math.round(my)}`;
    });

    window.addEventListener('mouseup', () => {
      isPanning = false;
      svg.style.cursor = 'grab';
    });

    svg.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoom = e.deltaY > 0 ? 1.1 : 0.9;
      const rect = svg.getBoundingClientRect();
      const mouseX = vb[0] + (e.clientX - rect.left) * (vb[2] / rect.width);
      const mouseY = vb[1] + (e.clientY - rect.top) * (vb[3] / rect.height);
      
      vb[2] *= zoom;
      vb[3] *= zoom;
      vb[0] = mouseX - (mouseX - vb[0]) * zoom;
      vb[1] = mouseY - (mouseY - vb[1]) * zoom;
      svg.setAttribute('viewBox', vb.join(' '));
    });
  </script>
