<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aparatlar · GSSTAD</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
    header { position: absolute; top: 0; left: 0; right: 0; height: 46px; display: flex; align-items: center; gap: 16px; padding: 0 14px; background: #111827; border-bottom: 1px solid #334155; box-sizing: border-box; }
    header .brand { font-weight: 800; letter-spacing: 0.5px; font-size: 15px; white-space: nowrap; }
    header .brand .r { color: #ef4444; } header .brand .y { color: #fbbf24; }
    header .brand small { color: #94a3b8; font-weight: 600; margin-left: 6px; }
    nav { display: flex; gap: 4px; height: 100%; }
    nav button { background: none; border: none; border-bottom: 3px solid transparent; color: #94a3b8; font-size: 14px; padding: 0 14px; cursor: pointer; height: 100%; }
    nav button:hover { color: #e2e8f0; }
    nav button.active { color: #fbbf24; border-bottom-color: #fbbf24; font-weight: 600; }
    header a.back { margin-left: auto; color: #cbd5e1; text-decoration: none; font-size: 13px; border: 1px solid #475569; border-radius: 6px; padding: 5px 10px; white-space: nowrap; }
    header a.back:hover { background: #1e293b; }
    main { position: absolute; top: 46px; left: 0; right: 0; bottom: 0; }
    main iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; }
    main iframe.active { display: block; }
    @media (max-width: 700px) { header .brand small { display: none; } nav button { padding: 0 8px; font-size: 13px; } }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="r">GS</span><span class="y">STAD</span><small>Aparatlar</small></div>
    <nav id="tabs">
      <button data-tab="matsing">Matsing-1</button>
      <button data-tab="gammanu">Gammanu</button>
      <button data-tab="tava" class="active">Tava Ofset</button>
    </nav>
    <a class="back" href="./index.html">← Ana proje</a>
  </header>
  <main id="frames"></main>
  <script>
    // Her sekme kendi sayfasını ayrı bir çerçevede çalıştırır: sol menüler ve ayarlar birbirinden bağımsızdır.
    // Çerçeve ilk açılışta yüklenir, sekme değişince kapanmaz (ayarlar korunur).
    const TABS = {
      matsing: './matsing_montaj_aparati.html?model=matsing&embed=1',
      gammanu: './matsing_montaj_aparati.html?model=gammanu&embed=1',
      tava: './tava_aski_aparati.html?embed=1'
    };
    const frames = {};
    const host = document.getElementById('frames');
    function show(tab) {
      if (!TABS[tab]) tab = 'tava'; // varsayılan sekme: Tava Ofset
      if (!frames[tab]) {
        const f = document.createElement('iframe');
        f.src = TABS[tab];
        f.title = tab;
        host.appendChild(f);
        frames[tab] = f;
      }
      Object.entries(frames).forEach(([k, f]) => f.classList.toggle('active', k === tab));
      document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      history.replaceState(null, '', '#' + tab);
    }
    document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => show(b.dataset.tab)));
    show(location.hash.slice(1));
  </script>
</body>
</html>
